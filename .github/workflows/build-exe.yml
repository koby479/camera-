name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Stamp the build number into the program
        run: |
          Set-Content -Path app/_build.py -Value "BUILD = ${{ github.run_number }}" -Encoding ascii
          Get-Content app/_build.py

      - name: Locate onvif WSDL directory
        id: onvif_wsdl
        run: |
          $wsdl = python -c "import onvif, os; print(os.path.join(os.path.dirname(onvif.__file__), 'wsdl'))"
          echo "path=$wsdl" >> $env:GITHUB_OUTPUT
          echo "Found WSDL dir: $wsdl"
          Get-ChildItem $wsdl -Recurse | Select-Object -First 5

      - name: Build EXE with PyInstaller (normal, windowed)
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "UniversalCamViewer" --collect-all numpy --collect-all cv2 --collect-all onvif --collect-all av --collect-all zeep --collect-all wsdiscovery --add-data "${{ steps.onvif_wsdl.outputs.path }};onvif\wsdl" --add-data "app;app" app/main.py

      - name: Build DEBUG EXE with PyInstaller (console, shows errors)
        run: |
          pyinstaller --noconfirm --onefile --console --name "UniversalCamViewer-DEBUG" --collect-all numpy --collect-all cv2 --collect-all onvif --collect-all av --collect-all zeep --collect-all wsdiscovery --add-data "${{ steps.onvif_wsdl.outputs.path }};onvif\wsdl" --add-data "app;app" app/main.py

      - name: SHA-256 of the EXE (the program checks its update against it)
        run: |
          $hash = (Get-FileHash dist/UniversalCamViewer.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/UniversalCamViewer.exe.sha256 -Value $hash -Encoding ascii
          Get-Content dist/UniversalCamViewer.exe.sha256

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalCamViewer-windows-exe
          path: dist/UniversalCamViewer.exe

      - name: Upload DEBUG EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalCamViewer-DEBUG-windows-exe
          path: dist/UniversalCamViewer-DEBUG.exe

      - name: Publish release (permanent download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          make_latest: true
          body: ${{ github.event.head_commit.message }}
          files: |
            dist/UniversalCamViewer.exe
            dist/UniversalCamViewer.exe.sha256
            dist/UniversalCamViewer-DEBUG.exe
