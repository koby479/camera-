name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "UniversalCamViewer" --add-data "app;app" app/main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalCamViewer-windows-exe
          path: dist/UniversalCamViewer.exe
